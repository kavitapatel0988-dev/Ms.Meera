<script>
function lineList(code){ return code.replace(/\r\n/g,"\n").split("\n"); }
function findColonIssues(lines, keywords){
  const issues=[];
  lines.forEach((line,idx)=>{
    const trimmed=line.trim();
    const startsWithKw=keywords.some(kw=>trimmed===kw||trimmed.startsWith(kw+" ")||trimmed.startsWith(kw+"("));
    if(startsWithKw && trimmed.length>0 && !trimmed.endsWith(":")){
      issues.push({message:`Line ${idx+1} mein "${trimmed}" ke aakhir mein colon (:) lagana bhool gaye.`});
    }
  });
  return issues;
}
function findIndentationIssues(lines){
  const issues=[];
  for(let i=0;i<lines.length-1;i++){
    const cur=lines[i].trimEnd();
    if(cur.trim().endsWith(":")){
      const next=lines[i+1];
      if(next!==undefined && next.trim().length>0 && !/^(\s{2,}|\t)/.test(next)){
        issues.push({message:`Line ${i+2} mein indentation missing hai — colon (:) ke baad wali line andar (space/tab) se shuru honi chahiye.`});
      }
    }
  }
  return issues;
}
function findQuoteIssues(code){
  const singles=(code.match(/'/g)||[]).length;
  const doubles=(code.match(/"/g)||[]).length;
  const issues=[];
  if(singles%2!==0) issues.push({message:`Kahin single quote (') adhoora reh gaya hai.`});
  if(doubles%2!==0) issues.push({message:`Kahin double quote (") adhoora reh gaya hai.`});
  return issues;
}
function findParenIssues(code){
  let depth=0;
  for(const ch of code){ if(ch==="(") depth++; if(ch===")") depth--; }
  if(depth!==0) return [{message: depth>0 ? `Ek "(" band nahi hui — closing ")" lagao.` : `Extra ")" hai jiska matching "(" nahi mila.`}];
  return [];
}
function findBracketIssues(code){
  let depth=0;
  for(const ch of code){ if(ch==="[") depth++; if(ch==="]") depth--; }
  if(depth!==0) return [{message: depth>0 ? `Ek "[" band nahi hui — closing "]" lagao.` : `Extra "]" hai jiska matching "[" nahi mila.`}];
  return [];
}
function genericChecks(code, keywordsForColon){
  const lines=lineList(code);
  return [...findColonIssues(lines,keywordsForColon), ...findIndentationIssues(lines), ...findQuoteIssues(code), ...findParenIssues(code), ...findBracketIssues(code)];
}

const TOPICS=[
  {id:"print", title:"Print Statement", emoji:"🖨️", xp:10,
   instruction:`Screen pe kuch likhna seekhte hain.\n\nprint("Hello Duniya!")\n\nIsse likho aur check karo.`,
   starter:`print("Hello Duniya!")`, solution:`print("Hello Duniya!")`,
   validate:(code)=>{
     const issues=genericChecks(code,[]);
     if(issues.length) return {ok:false,issues};
     if(!/print\s*\(/.test(code)) return {ok:false,issues:[{message:`"print(" nazar nahi aaya.`}]};
     if(!/print\s*\(\s*["'].*["']\s*\)/.test(code)) return {ok:false,issues:[{message:`print() ke andar quotes mein text hona chahiye.`}]};
     return {ok:true,message:`Bilkul sahi! print() jo bhi likho, screen pe dikha deta hai. 🎉`};
   }},
  {id:"variables", title:"Variables", emoji:"📦", xp:10,
   instruction:`Ek variable banao apna naam store karke, phir print karo.\n\nname = "Rahul"\nprint(name)`,
   starter:`name = "Rahul"\nprint(name)`, solution:`name = "Rahul"\nprint(name)`,
   validate:(code)=>{
     const issues=genericChecks(code,[]);
     if(issues.length) return {ok:false,issues};
     const assignMatch=code.match(/(\w+)\s*=\s*["'][^"']*["']/);
     if(!assignMatch) return {ok:false,issues:[{message:`Pattern: naam = "text" — variable banega tabhi.`}]};
     const varName=assignMatch[1];
     const printRegex=new RegExp(`print\\s*\\(\\s*${varName}\\s*\\)`);
     if(!printRegex.test(code)) return {ok:false,issues:[{message:`Variable "${varName}" bana, ab print(${varName}) se dikhao bhi.`}]};
     return {ok:true,message:`Perfect! Variable banaya aur print se dikhaya bhi. 🎉`};
   }},
  {id:"ifelse", title:"If / Else", emoji:"🔀", xp:15,
   instruction:`Number even hai ya odd, check karo.\n\nnumber = 10\nif number % 2 == 0:\n    print("Even")\nelse:\n    print("Odd")`,
   starter:`number = 10\nif number % 2 == 0:\n    print("Even")\nelse:\n    print("Odd")`,
   solution:`number = 10\nif number % 2 == 0:\n    print("Even")\nelse:\n    print("Odd")`,
   validate:(code)=>{
     const issues=genericChecks(code,["if","else","elif"]);
     if(issues.length) return {ok:false,issues};
     if(!/\bif\b/.test(code)) return {ok:false,issues:[{message:`"if" keyword missing hai.`}]};
     if(!/\belse\b/.test(code)) return {ok:false,issues:[{message:`"else" part missing hai.`}]};
     if(!/%\s*2\s*==\s*0/.test(code)) return {ok:false,issues:[{message:`Even check ke liye "number % 2 == 0" chahiye.`}]};
     return {ok:true,message:`Badhiya! if/else se decision lena aa gaya. 🎉`};
   }},
  {id:"loops", title:"For Loop", emoji:"🔁", xp:15,
   instruction:`1 se 5 tak print karo.\n\nfor i in range(1, 6):\n    print(i)`,
   starter:`for i in range(1, 6):\n    print(i)`, solution:`for i in range(1, 6):\n    print(i)`,
   validate:(code)=>{
     const issues=genericChecks(code,["for","while"]);
     if(issues.length) return {ok:false,issues};
     if(!/\bfor\b.*\bin\b.*range\s*\(/.test(code)) return {ok:false,issues:[{message:`Pattern: for i in range(...):`}]};
     if(!/range\s*\(\s*\d+\s*,\s*\d+\s*\)/.test(code)) return {ok:false,issues:[{message:`range() mein do numbers chahiye, comma se.`}]};
     return {ok:true,message:`Sahi! for loop se repeat karna aa gaya. 🎉`};
   }},
  {id:"while", title:"While Loop", emoji:"🔂", xp:15,
   instruction:`1 se 5 tak while loop se print karo.\n\ni = 1\nwhile i <= 5:\n    print(i)\n    i = i + 1`,
   starter:`i = 1\nwhile i <= 5:\n    print(i)\n    i = i + 1`,
   solution:`i = 1\nwhile i <= 5:\n    print(i)\n    i = i + 1`,
   validate:(code)=>{
     const issues=genericChecks(code,["while"]);
     if(issues.length) return {ok:false,issues};
     if(!/\bwhile\b/.test(code)) return {ok:false,issues:[{message:`"while" keyword missing hai.`}]};
     if(!/i\s*=\s*i\s*\+\s*1/.test(code) && !/i\s*\+=\s*1/.test(code)) return {ok:false,issues:[{message:`Loop ke andar "i" ko badhana mat bhoolo (i = i + 1), warna infinite loop ban jaayega!`}]};
     return {ok:true,message:`Zabardast! while loop tab tak chalta hai jab tak condition True rahe. 🎉`};
   }},
  {id:"functions", title:"Functions", emoji:"⚙️", xp:20,
   instruction:`Do numbers add karne wala function banao.\n\ndef add(a, b):\n    return a + b\n\nprint(add(4, 5))`,
   starter:`def add(a, b):\n    return a + b\n\nprint(add(4, 5))`,
   solution:`def add(a, b):\n    return a + b\n\nprint(add(4, 5))`,
   validate:(code)=>{
     const issues=genericChecks(code,["def"]);
     if(issues.length) return {ok:false,issues};
     if(!/\bdef\s+\w+\s*\([^)]*\)\s*:/.test(code)) return {ok:false,issues:[{message:`Pattern: def naam(parameters):`}]};
     if(!/\breturn\b/.test(code)) return {ok:false,issues:[{message:`"return" missing hai.`}]};
     const funcNameMatch=code.match(/def\s+(\w+)\s*\(/);
     if(funcNameMatch){
       const fname=funcNameMatch[1];
       const calls=code.match(new RegExp(`\\b${fname}\\s*\\(`,"g"))||[];
       if(calls.length<2) return {ok:false,issues:[{message:`Function "${fname}" banaya, ab call bhi karo: ${fname}(...)`}]};
     }
     return {ok:true,message:`Zabardast! Function reusable code banata hai. 🎉`};
   }},
  {id:"lists", title:"Lists", emoji:"🧺", xp:15,
   instruction:`Fruits ki list banao, pehla fruit print karo.\n\nfruits = ["apple", "mango", "banana"]\nprint(fruits[0])`,
   starter:`fruits = ["apple", "mango", "banana"]\nprint(fruits[0])`,
   solution:`fruits = ["apple", "mango", "banana"]\nprint(fruits[0])`,
   validate:(code)=>{
     const issues=genericChecks(code,[]);
     if(issues.length) return {ok:false,issues};
     if(!/\[\s*["'][^"']*["']\s*(,\s*["'][^"']*["']\s*)*\]/.test(code)) return {ok:false,issues:[{message:`Pattern: naam = ["item1", "item2"]`}]};
     if(!/\[\s*-?\d+\s*\]/.test(code)) return {ok:false,issues:[{message:`Index [0] se ek item nikaalo.`}]};
     return {ok:true,message:`Sahi! Lists mein index [0], [1]... se access karte hain. 🎉`};
   }},
  {id:"strings", title:"Strings", emoji:"🔤", xp:15,
   instruction:`Do naam jodo (+) aur upper() try karo.\n\nfirst = "Ravi"\nlast = "Kumar"\nfull = first + " " + last\nprint(full.upper())`,
   starter:`first = "Ravi"\nlast = "Kumar"\nfull = first + " " + last\nprint(full.upper())`,
   solution:`first = "Ravi"\nlast = "Kumar"\nfull = first + " " + last\nprint(full.upper())`,
   validate:(code)=>{
     const issues=genericChecks(code,[]);
     if(issues.length) return {ok:false,issues};
     if(!/\+/.test(code)) return {ok:false,issues:[{message:`Strings ko jodne ke liye "+" use karo.`}]};
     if(!/\.upper\(\)/.test(code)) return {ok:false,issues:[{message:`.upper() try karo — ye text ko CAPITAL letters mein badal deta hai.`}]};
     return {ok:true,message:`Sahi! String jodna (+) aur .upper() jaise built-in methods use karna aa gaya. 🎉`};
   }},
  {id:"dicts", title:"Dictionaries", emoji:"📖", xp:20,
   instruction:`Ek student ki info dictionary mein rakho.\n\nstudent = {"name": "Anjali", "age": 20}\nprint(student["name"])`,
   starter:`student = {"name": "Anjali", "age": 20}\nprint(student["name"])`,
   solution:`student = {"name": "Anjali", "age": 20}\nprint(student["name"])`,
   validate:(code)=>{
     const issues=genericChecks(code,[]);
     if(issues.length) return {ok:false,issues};
     if(!/\{[^}]*:[^}]*\}/.test(code)) return {ok:false,issues:[{message:`Dictionary ka pattern: {"key": "value"} — curly braces { } aur colon : zaroori hai.`}]};
     if(!/\[\s*["'][^"']+["']\s*\]/.test(code)) return {ok:false,issues:[{message:`Dictionary se value nikaalne ke liye ["key"] use karo, jaise student["name"]`}]};
     return {ok:true,message:`Zabardast! Dictionary mein har value ka apna "key" (naam) hota hai. 🎉`};
   }},
  {id:"nested", title:"Nested If + Booleans", emoji:"🧠", xp:20,
   instruction:`Ek number positive, negative ya zero hai, check karo.\n\nnum = -5\nif num > 0:\n    print("Positive")\nelif num < 0:\n    print("Negative")\nelse:\n    print("Zero")`,
   starter:`num = -5\nif num > 0:\n    print("Positive")\nelif num < 0:\n    print("Negative")\nelse:\n    print("Zero")`,
   solution:`num = -5\nif num > 0:\n    print("Positive")\nelif num < 0:\n    print("Negative")\nelse:\n    print("Zero")`,
   validate:(code)=>{
     const issues=genericChecks(code,["if","elif","else"]);
     if(issues.length) return {ok:false,issues};
     if(!/\belif\b/.test(code)) return {ok:false,issues:[{message:`"elif" missing hai — teesra option check karne ke liye elif use karte hain.`}]};
     if(!/>\s*0/.test(code) || !/<\s*0/.test(code)) return {ok:false,issues:[{message:`Positive (> 0) aur negative (< 0) dono conditions check karo.`}]};
     return {ok:true,message:`Ekdum sahi! elif se multiple conditions ek ke baad ek check hoti hain. 🎉`};
   }}
];

let selectedId=TOPICS[0].id;
let completed={};
let totalXP=0;
let voiceOn=true;
let selectedVoice=null;
let pitchVal=1.1;
let rateVal=0.95;

function totalPossibleXP(){ return TOPICS.reduce((s,t)=>s+t.xp,0); }

function pickBestDefaultVoice(voices){
  const priorityNames=["google uk english female","google us english","microsoft heera","microsoft kalpana","female","hindi"];
  for(const p of priorityNames){
    const found=voices.find(v=>v.name.toLowerCase().includes(p));
    if(found) return found;
  }
  const hi=voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("hi"));
  if(hi) return hi;
  const enIn=voices.find(v=>v.lang && v.lang.toLowerCase()==="en-in");
  if(enIn) return enIn;
  return voices[0]||null;
}

function populateVoiceList(){
  if(!window.speechSynthesis) return;
  const voices=window.speechSynthesis.getVoices();
  const sel=document.getElementById("voiceSelect");
  sel.innerHTML="";
  voices.forEach((v,i)=>{
    const opt=document.createElement("option");
    opt.value=i;
    opt.textContent=`${v.name} (${v.lang})`;
    sel.appendChild(opt);
  });
  if(!selectedVoice){
    selectedVoice=pickBestDefaultVoice(voices);
  }
  const idx=voices.indexOf(selectedVoice);
  if(idx>=0) sel.value=idx;
  sel.onchange=()=>{ selectedVoice=voices[parseInt(sel.value)]; };
}

function speakText(text){
  if(!voiceOn) return;
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const clean=text.replace(/[✅💡📖🔄🎉😊🤔🙂👇•⭐🎙️🔊🖨️📦🔀🔁🔂⚙️🧺🔤📖🧠]/g,"").trim();
    if(!clean) return;
    const utter=new SpeechSynthesisUtterance(clean);
    if(selectedVoice) utter.voice=selectedVoice;
    utter.lang=selectedVoice?selectedVoice.lang:"en-IN";
    utter.pitch=pitchVal;
    utter.rate=rateVal;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

function getTopic(){ return TOPICS.find(t=>t.id===selectedId); }

function renderSidebar(){
  const sb=document.getElementById("sidebar");
  sb.innerHTML='<div class="sidebar-label">Kya sikhna hai?</div>';
  TOPICS.forEach(t=>{
    const btn=document.createElement("button");
    btn.className="topic-btn"+(t.id===selectedId?" active":"");
    btn.innerHTML=`<span>${t.emoji}</span><span>${t.title}</span>`+(completed[t.id]?'<span class="check">✓</span>':`<span class="lvl">+${t.xp}xp</span>`);
    btn.onclick=()=>{ selectedId=t.id; loadTopic(); };
    sb.appendChild(btn);
  });
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

function renderProgress(){
  document.getElementById("xpPill").textContent=`⭐ ${totalXP} XP`;
  const pct=Math.min(100, Math.round((totalXP/totalPossibleXP())*100));
  document.getElementById("xpBar").style.width=pct+"%";
}

function loadTopic(){
  const t=getTopic();
  document.getElementById("codeArea").value=t.starter;
  document.getElementById("fileName").textContent=t.title.toLowerCase().replace(/[\s/]/g,"_")+".py";
  document.getElementById("bubble").className="bubble";
  document.getElementById("bubble").textContent=t.instruction;
  document.getElementById("hintBox").style.display="none";
  document.getElementById("solBox").style.display="none";
  renderSidebar();
  speakText(t.instruction);
}

document.getElementById("checkBtn").onclick=()=>{
  const t=getTopic();
  const code=document.getElementById("codeArea").value;
  const result=t.validate(code);
  const bubble=document.getElementById("bubble");
  if(result.ok){
    bubble.className="bubble ok";
    bubble.textContent=result.message;
    if(!completed[t.id]){
      completed[t.id]=true;
      totalXP+=t.xp;
      showToast(`+${t.xp} XP! "${t.title}" complete 🎉`);
    }
    renderSidebar(); renderProgress();
    speakText(result.message);
  } else {
    bubble.className="bubble";
    bubble.innerHTML='<div class="issue-title">Yahan dekho 👇</div>'+result.issues.map(i=>`<div class="issue">• ${i.message}</div>`).join("");
    speakText(result.issues.map(i=>i.message).join(". "));
  }
};

document.getElementById("hintBtn").onclick=()=>{
  const box=document.getElementById("hintBox");
  box.textContent="Hint: instruction ke example ko dhyan se dekho — keywords aur symbols (: , ( ) \" \" [ ]) sahi jagah pe hone chahiye.";
  box.style.display = box.style.display==="none" ? "block" : "none";
};
document.getElementById("solBtn").onclick=()=>{
  const box=document.getElementById("solBox");
  if(box.style.display==="none"){ box.textContent=getTopic().solution; box.style.display="block"; }
  else box.style.display="none";
};
document.getElementById("resetBtn").onclick=()=>{ loadTopic(); };
document.getElementById("voiceToggle").onclick=(e)=>{
  voiceOn=!voiceOn;
  e.target.textContent = voiceOn ? "🔊 ON" : "🔇 OFF";
  e.target.className = "pill mono" + (voiceOn ? " on" : "");
  if(!voiceOn && window.speechSynthesis) window.speechSynthesis.cancel();
};
document.getElementById("voiceSettingsBtn").onclick=()=>{
  document.getElementById("voicePanel").classList.toggle("show");
};
document.getElementById("testVoiceBtn").onclick=()=>{
  speakText("Namaste! Main Ms. Meera hoon, tumhari coding teacher. Chalo saath mein sikhte hain.");
};
document.getElementById("pitchRange").oninput=(e)=>{ pitchVal=parseFloat(e.target.value); };
document.getElementById("rateRange").oninput=(e)=>{ rateVal=parseFloat(e.target.value); };

if(window.speechSynthesis){
  window.speechSynthesis.onvoiceschanged=populateVoiceList;
  populateVoiceList();
}
loadTopic();
renderProgress();
</script>
</body>
</html>
